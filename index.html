body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom));background:#1d2b5b var(--ola) center/cover no-repeat;color:#F7F0E2;font-family:"Bricolage Grotesque",system-ui,sans-serif}
body::before{content:"";position:fixed;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(15,25,50,.12) 100%);pointer-events:none;z-index:0}
.note{position:relative;z-index:1;width:min(760px,100%);padding:24px 28px;border:3px solid rgba(247,240,226,.65);border-radius:14px;color:#F7F0E2;text-align:center;background:linear-gradient(rgba(29,43,91,.65),rgba(29,43,91,.65)), var(--ola) center/cover no-repeat;box-shadow:0 30px 70px rgba(0,0,0,.45);}
.note::before{content:"";position:absolute;top:7px;right:7px;bottom:7px;left:7px;border:1px solid rgba(247,240,226,.22);border-radius:3px;pointer-events:none}
.note::after{content:"換";position:absolute;top:-14px;right:22px;width:40px;height:40px;border-radius:50%;background:var(--stamp);color:#F7F0E2;display:grid;place-items:center;font-weight:800;font-size:.95rem;border:2px solid #F7F0E2;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:rotate(9deg)}

<body>
<main class="note">
  <h1>Cambio de Divisas</h1>

<script>
const API = "https://api.frankfurter.dev/v1";
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).trim().replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : NaN; };
const fmt = n => Number.isFinite(n) ? String(+n.toFixed(Math.abs(n) < 1 ? 6 : 2)) : "";
let rate = 1, series = [], turns = 0, req = 0, raf = 0, lastKey = "";
let currentController = null;

const STORAGE_KEY = "cambio-divisas:v2";
function loadPrefs() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; } }
let prefsTimer = 0;
function savePrefs(p) { clearTimeout(prefsTimer); prefsTimer = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {} }, 300); }

async function getJSON(path, signal) {
  const r = await fetch(API + path, signal ? { signal } : undefined);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// Sugerencia de monedas según el idioma/región del navegador
function guessDefaultCurrencies(names) {
  const lang = (navigator.language || "es-ES").toUpperCase();
  const region = lang.includes("-") ? lang.split("-")[1] : "ES";
  const map = { ES:"EUR", US:"USD", GB:"GBP", MX:"MXN", AR:"ARS", CL:"CLP", CO:"COP", PE:"PEN", EC:"USD", FR:"EUR", DE:"EUR", IT:"EUR" };
  const from = map[region] && names[map[region]] ? map[region] : "EUR";
  const to = from === "EUR" ? "USD" : "EUR";
  return [from, to];
}

async function loadCurrencies() {
  let names;
  try { names = await getJSON("/currencies"); }
  catch { names = { EUR: "Euro", USD: "Dólar estadounidense", GBP: "Libra esterlina", JPY: "Yen japonés", CHF: "Franco suizo", MXN: "Peso mexicano", ARS: "Peso argentino", CLP: "Peso chileno", COP: "Peso colombiano", PEN: "Sol peruano" }; }
  if (!names.EUR) names.EUR = "Euro";
  const options = Object.keys(names).sort()
    .map(c => `<option value="${c}">${c} - ${names[c]}</option>`).join("");
  $("from").innerHTML = $("to").innerHTML = options;

  const prefs = loadPrefs();
  let from, to;
  if (prefs.from && names[prefs.from] && prefs.to && names[prefs.to] && prefs.from !== prefs.to) {
    from = prefs.from; to = prefs.to;
  } else {
    [from, to] = guessDefaultCurrencies(names);
  }
  $("from").value = from;
  $("to").value = to;
  if (Number.isFinite(prefs.amount)) $("amount").value = String(prefs.amount);
}

async function refresh() {
  const id = ++req;
  if (currentController) currentController.abort();
  currentController = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const signal = currentController ? currentController.signal : undefined;

  const f = $("from").value, t = $("to").value;
  const key = f + t, changed = key !== lastKey;
  if (f === t) {
    lastKey = key; rate = 1; series = [];
    $("rate").textContent = `1 ${f} = 1 ${t}`;
    $("status").textContent = "Misma moneda en los dos lados.";
    show(changed); draw(false); return;
  }
  document.querySelector(".amounts").classList.add("loading");
  let newRate, newSeries, day;
  try {
    const start = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    const hist = await getJSON(`/${start}..?from=${f}&to=${t}`, signal);
    const dias = Object.keys(hist.rates).sort();
    if (!dias.length) throw new Error("sin datos");
    newSeries = dias.map(d => hist.rates[d][t]);
    newRate = newSeries[newSeries.length - 1];
    day = new Date(dias[dias.length - 1] + "T12:00:00")
      .toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  } catch (e) {
    if (id !== req || (e && e.name === "AbortError")) return;
    document.querySelector(".amounts").classList.remove("loading");
    $("status").innerHTML = `No se pudieron cargar las tasas. <button type="button" class="retry" id="retry">Reintentar</button>`;
    const btn = $("retry");
    if (btn) btn.addEventListener("click", refresh, { once: true });
    return;
  }
  if (id !== req) return;
  lastKey = key; rate = newRate; series = newSeries;
  const arrow = (series.length > 1 && series[series.length-1] >= series[0]) ? "▲" : "▼";
  $("rate").textContent = `1 ${f} = ${fmt(rate)} ${t}  ${arrow}`;
  $("status").textContent = `Tasa del ${day}, publicada por el Banco Central Europeo. Se actualiza sola cada 10 min.`;
  show(changed); draw(changed);
  savePrefs({ from: f, to: t, amount: num($("amount").value) });
}

function recalc() {
  cancelAnimationFrame(raf);
  $("result").value = fmt(num($("amount").value) * rate);
  savePrefs({ from: $("from").value, to: $("to").value, amount: num($("amount").value) });
}

function show(animate) {
  document.querySelector(".amounts").classList.remove("loading");
  cancelAnimationFrame(raf);
  if (document.activeElement === $("result")) {
    const a = fmt(num($("result").value) / rate);
    $("amount").value = a;
    savePrefs({ from: $("from").value, to: $("to").value, amount: num(a) });
    return;
  }
  const to = num($("amount").value) * rate, from = num($("result").value);
  if (!animate || !Number.isFinite(to) || !Number.isFinite(from) || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    $("result").value = fmt(to); return;
  }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min((now - t0) / 380, 1), e = 1 - Math.pow(1 - k, 3);
    $("result").value = fmt(from + (to - from) * e);
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function draw(animate) {
  const s = series, chart = $("chart");
  if (s.length < 2) { chart.innerHTML = ""; $("trend").textContent = ""; return; }
  const min = Math.min(...s), max = Math.max(...s), w = 600, h = 80, p = 6;
  const pts = s.map((v, i) => [
    p + i * (w - 2 * p) / (s.length - 1),
    h - p - (max === min ? .5 : (v - min) / (max - min)) * (h - 2 * p)
  ]);
  const last = pts[pts.length - 1];
  chart.innerHTML =
    `<polyline pathLength="1" class="${animate ? "line" : ""}" points="${pts.map(q => q.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#C2415A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#C2415A"/>`;
  const ch = (s[s.length - 1] / s[0] - 1) * 100;
  $("trend").textContent = `${ch >= 0 ? "Subió" : "Bajó"} ${Math.abs(ch).toFixed(2).replace(".", ",")} % en 30 días`;
}

let copyTimer = null;
function showCopied() {
  const btn = $("copy");
  if (!btn) return;
  btn.textContent = "✓";
  btn.style.background = "rgba(194,65,90,.9)";
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { btn.textContent = "📋"; btn.style.background = ""; }, 1200);
}
function copyResult() {
  const a = $("amount").value || "0";
  const r = $("result").value || "";
  const f = $("from").value, t = $("to").value;
  const val = `${a} ${f} = ${r} ${t}`;
  if (!r) return;
  const onSuccess = () => { if (navigator.vibrate) navigator.vibrate(6); showCopied(); };
  const fallback = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = val; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      const range = document.createRange(); range.selectNodeContents(ta);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      sel.removeAllRanges();
      if (ok) onSuccess();
    } catch {}
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(val).then(onSuccess).catch(fallback);
  } else {
    fallback();
  }
}

$("amount").addEventListener("input", recalc);
$("result").addEventListener("input", () => {
  cancelAnimationFrame(raf);
  const a = fmt(num($("result").value) / rate);
  $("amount").value = a;
  savePrefs({ from: $("from").value, to: $("to").value, amount: num(a) });
});
$("from").addEventListener("change", () => { refresh(); savePrefs({ from: $("from").value, to: $("to").value, amount: num($("amount").value) }); });
$("to").addEventListener("change", () => { refresh(); savePrefs({ from: $("from").value, to: $("to").value, amount: num($("amount").value) }); });
$("swap").addEventListener("click", () => {
  const f = $("from").value;
  $("from").value = $("to").value;
  $("to").value = f;
  $("swap").style.transform = `rotate(${++turns * 180}deg)`;
  if (series.length) {
    const f2 = $("from").value, t2 = $("to").value;
    rate = 1 / rate; series = series.map(v => 1 / v); lastKey = f2 + t2;
    $("rate").textContent = `1 ${f2} = ${fmt(rate)} ${t2}`;
    show(true); draw(true);
  }
  refresh();
});

const copyBtn = $("copy");
if (copyBtn) copyBtn.addEventListener("click", copyResult);

document.title = "Cambio de Divisas";
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
loadCurrencies().then(refresh);
// primer tick de los relojes independiente
const fmtCache = {};
const timeFmt = tz => fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat("es-ES", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }));
function tickClocks(){
  if (document.hidden) return;
  const now = new Date();
  document.getElementById("clk-left").textContent = timeFmt(document.getElementById("clk-tz-left").value).format(now);
  document.getElementById("clk-tz-time").textContent = timeFmt(document.getElementById("clk-tz").value).format(now);
}
document.getElementById("clk-tz-left").addEventListener("change", tickClocks);
document.getElementById("clk-tz").addEventListener("change", tickClocks);
setInterval(tickClocks, 1000);
tickClocks();
setInterval(() => { if (!document.hidden) refresh(); }, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tickClocks(); });
</script>
